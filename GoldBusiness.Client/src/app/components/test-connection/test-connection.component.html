<div class="container">
  <h2>{{ translations.title }}</h2>

  <!-- Sección de configuración -->
  <div class="config-section">
    <h3>{{ translations.configTitle }}</h3>
    <app-language-selector></app-language-selector>
  </div>

  <!-- Sección de prueba -->
  <div class="test-section">
    <h3>{{ translations.connectionTitle }}</h3>
    <button (click)="testConnection()" [disabled]="isLoading" class="btn-primary">
      @if (!isLoading) {
        <span>{{ translations.testButton }}</span>
      }
      @if (isLoading) {
        <span>
          <app-loader [message]="translations.testing" [size]="14" [inline]="true" [color]="'#fff'"></app-loader>
        </span>
      }
    </button>
  </div>

  <!-- Resultados -->
  @if (error) {
    <div class="error">
      {{ translations.errorLabel }}: {{ error }}
    </div>
  }

  @if (apiResponse) {
    <div class="success">
      <h3>{{ translations.successTitle }}</h3>
      <pre>{{ apiResponse | json }}</pre>
    </div>
  }
</div>
